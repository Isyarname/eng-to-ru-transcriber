[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "eng-to-ru-transcriber"
version = "0.5.0"
description = "automatic english-to-cyrillic text transcriber"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kodovy-pesets" }]
dependencies = [
    "crispy-ipa>=0.1.0",
]
keywords = [
    "transcription",
    "transliteration",
    "english",
    "russian",
    "tts",
    "text-to-speech",
    "nlp",
    "text-processing",
    "text-normalization",
    "g2p",
    "ipa",
    "cyrillic",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
    "Natural Language :: English",
    "Natural Language :: Russian",
]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/Isyarname/eng-to-ru-transcriber"
Repository = "https://github.com/Isyarname/eng-to-ru-transcriber"
Changelog = "https://github.com/Isyarname/eng-to-ru-transcriber/blob/main/docs/CHANGELOG.md"
Issues = "https://github.com/Isyarname/eng-to-ru-transcriber/issues"

# src-layout: setuptools ищет пакеты внутри src/
[tool.setuptools.packages.find]
where = ["src"]
